pool: vistara-agent

stages:
- stage: terraform_init_and_validate
  displayName: Init and Validate

  jobs:
  - job: init_validate
    displayName: Init and Validate

    steps:
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'

    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'

- stage: Terraformplan
  displayName: plan
  jobs:
    - job: terraform-plan
      displayName: plan
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'


      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'

- stage: terraform_apply
  displayName: apply
  jobs:
    - job: terraform-apply
      displayName: apply
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'


      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'apply'